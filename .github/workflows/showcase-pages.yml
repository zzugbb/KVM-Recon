name: Showcase Pages
on:
  push:
    branches: [main]
    paths: ['showcase/**', '.github/workflows/showcase-pages.yml']
  pull_request:
    paths: ['showcase/**', '.github/workflows/showcase-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: showcase-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm --prefix showcase test
      - run: npm --prefix showcase run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: showcase/out
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
