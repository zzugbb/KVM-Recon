<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>KVM-Recon</title>
    <style>
:root { color:#0f172a; background:#f8fafc; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
* { box-sizing:border-box; }
body { margin:0; min-width:980px; background:#f8fafc; }
button { border:0; border-radius:10px; padding:12px 18px; background:#2563eb; color:#fff; font-size:15px; font-weight:600; }
button:disabled { opacity:0.55; }
input, select { width:100%; border:1px solid #cbd5e1; border-radius:10px; padding:10px 12px; color:#0f172a; font-size:15px; background:#fff; }
.app-shell { display:grid; justify-items:center; gap:20px; padding:32px; }
.hero { width:min(980px,100%); border:1px solid #e2e8f0; border-radius:28px; background:#fff; box-shadow:0 24px 80px rgb(15 23 42 / 10%); padding:48px; }
.eyebrow { margin:0 0 16px; color:#2563eb; font-size:13px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; }
.hero-heading { display:flex; align-items:baseline; gap:12px 16px; }
h1 { margin:0; font-size:64px; letter-spacing:-0.05em; }
.app-version { color:#64748b; font-size:18px; font-weight:650; }
.subtitle { margin:12px 0 0; color:#334155; font-size:24px; font-weight:700; }
.description { max-width:680px; color:#475569; font-size:16px; line-height:1.8; }
.target-form { display:grid; gap:12px; width:100%; margin-top:16px; }
.field-row { display:grid; gap:12px; }
.field-row-primary { grid-template-columns:minmax(220px,1fr) 100px; }
.field-row-pair { grid-template-columns:1fr 1fr; }
.note-field { display:grid; gap:8px; }
.phase-label { margin:20px 0 0; color:#1d4ed8; font-size:14px; font-weight:700; }
.next-step { margin:16px 0 0; color:#1d4ed8; font-size:15px; font-weight:700; line-height:1.6; }
.target-form label { display:grid; gap:8px; color:#334155; font-size:14px; font-weight:700; }
.actions, .actions-extra { display:flex; flex-wrap:wrap; align-items:center; gap:12px; }
.actions { margin-top:16px; }
.actions-extra { margin-top:12px; padding-top:12px; border-top:1px solid #e2e8f0; }
.actions-extra-label { color:#64748b; font-size:13px; font-weight:600; }
.actions-extra select { width:auto; min-width:148px; }
.actions-extra button { padding:10px 14px; font-size:14px; }
button.secondary { background:#e2e8f0; color:#1e293b; }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <section class="hero">
        <p class="eyebrow">Offline BMC/KVM Discovery Toolkit</p>
        <div class="hero-heading">
          <h1>KVM-Recon</h1>
          <span class="app-version">v0.2.2</span>
        </div>
        <p class="subtitle">离线 BMC/KVM 资料采集工具</p>
        <p class="description">
          在机房内采集登录、HTML5 KVM 入口、HTTP/WebSocket、页面截图和离场验收资料，
          导出脱敏 Capture Pack 供后续兼容性分析。
        </p>
        <p class="phase-label">当前阶段：新建采集</p>
        <div class="target-form">
          <div class="field-row field-row-primary">
            <label>BMC 地址<input value="10.0.0.10" readonly /></label>
            <label>端口<input value="443" readonly /></label>
          </div>
          <div class="field-row field-row-pair">
            <label>现场厂商<input placeholder="铭牌，不作为 kvmFamily" readonly /></label>
            <label>现场型号<input placeholder="可选" readonly /></label>
          </div>
          <div class="field-row field-row-pair">
            <label>现场固件<input placeholder="可选" readonly /></label>
            <label>机柜位置<input placeholder="可选" readonly /></label>
          </div>
          <label class="note-field">作业备注<input placeholder="可选，不填写账号或密码" readonly /></label>
        </div>
        <div class="actions">
          <button type="button">新建采集作业</button>
          <button type="button" class="secondary" disabled>暂停采集</button>
          <button type="button" class="secondary" disabled>关闭采集窗口</button>
          <button type="button" class="secondary" disabled>登录后复验探测</button>
          <button type="button" class="secondary" disabled>停止采集并导出</button>
        </div>
        <p class="next-step">填写 BMC 地址后点「新建采集作业」。在弹出窗口里手工登录，再打开 HTML5 KVM。</p>
        <div class="actions-extra">
          <span class="actions-extra-label">补拍画面（可选）</span>
          <select disabled aria-label="补拍画面类型">
            <option>KVM 画面</option>
          </select>
          <button type="button" class="secondary" disabled>采集当前画面</button>
        </div>
      </section>
    </main>
  </body>
</html>
